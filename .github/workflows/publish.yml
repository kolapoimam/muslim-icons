name: Stage npm packages
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA or version tag containing the prepared package versions'
        type: string
        required: true
      packages:
        description: 'Package selection (all stages each unpublished version independently)'
        type: choice
        options:
          - all
          - react
          - vue
          - svelte
          - svg
        default: all
      dry_run:
        description: 'Inspect packages without submitting them to npm'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: npm-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Verify immutable release source
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: node scripts/verify-release-ref.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Use npm with staged-publishing support
        run: npm install -g npm@latest
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run verify:packages
      - run: npm run test:packages
      - name: Pack selected packages and optionally stage for maintainer approval
        env:
          SELECTED_PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run stage-packages -- --packages "$SELECTED_PACKAGES" --dry-run
          else
            npm run stage-packages -- --packages "$SELECTED_PACKAGES" --publish
          fi
      - name: Preserve inspected tarballs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-tarballs
          path: work/npm/*.tgz
          if-no-files-found: ignore
