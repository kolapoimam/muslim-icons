name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag version, e.g. 0.1.0'
        type: string
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}
      - name: Set up Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm
        run: npm install -g npm@latest
      - name: Verify version
        env:
          VERSION: ${{ inputs.version }}
        run: node -e "if(require('./packages/react/package.json').version !== process.env.VERSION) process.exit(1)"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test icons
        run: npm test
      - name: Build package
        run: npm run build
      - name: Verify package contents
        run: node scripts/verify-package.mjs
      - name: Inspect tarball
        run: npm pack --workspace @muslim-icons/react --dry-run
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish --workspace @muslim-icons/react --access public
