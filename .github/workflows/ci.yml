name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate canonical SVGs, generators and release selection
        run: npm test
      - name: Build all public packages and internal demo
        run: npm run build
      - name: Check native framework types
        run: npm run typecheck
      - name: Verify published entry points and SVG assets
        run: npm run verify:packages
      - name: Install and test packed packages in standalone consumers
        run: npm run test:packages
